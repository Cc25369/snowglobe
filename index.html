<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3D 雪景水晶球</title>
<style>
    body { margin: 0; overflow: hidden; background-color: #050510; color: #fff; font-family: sans-serif; touch-action: none; }
    #container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
    #ui { position: absolute; bottom: 40px; left: 0; width: 100%; display: flex; justify-content: center; gap: 15px; z-index: 10; }
    .btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 12px 20px; border-radius: 30px; backdrop-filter: blur(5px); cursor: pointer; font-size: 16px; }
    .btn:active { background: rgba(255,255,255,0.3); }
    #tip { position: absolute; top: 50px; width: 100%; text-align: center; color: rgba(255,255,255,0.6); font-size: 14px; pointer-events: none; }
</style>
<!-- 使用国内字节跳动 CDN 加载 Three.js，彻底解决被墙黑屏 -->
<script type="importmap">
{
    "imports": {
        "three": "https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/three.js/0.158.0/three.module.js"
    }
}
</script>
</head>
<body>
<div id="container"></div>
<div id="tip">拖拽旋转 · 双指缩放</div>
<div id="ui">
    <button class="btn" id="snowBtn">❄️ 下雪</button>
    <button class="btn" id="shakeBtn">↻ 摇晃</button>
    <button class="btn" id="musicBtn">▶️ 播放音乐</button>
</div>

<script type="module">
import * as THREE from 'three';

// 基础场景
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050510, 0.02);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.getElementById('container').appendChild(renderer.domElement);

// 灯光
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const pointLight = new THREE.PointLight(0x88ccff, 1, 10);
pointLight.position.set(2, 3, 2);
scene.add(pointLight);

// 水晶球外壳 (玻璃质感)
const sphereGeo = new THREE.SphereGeometry(2, 64, 64);
const sphereMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, transparent: true, opacity: 0.1,
    roughness: 0.1, metalness: 0.1, transmission: 0.9, thickness: 0.5
});
const crystalBall = new THREE.Mesh(sphereGeo, sphereMat);
scene.add(crystalBall);

// 底座
const baseGeo = new THREE.CylinderGeometry(1.2, 1.5, 0.5, 32);
const baseMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
const base = new THREE.Mesh(baseGeo, baseMat);
base.position.y = -2.25;
scene.add(base);

// 内部小场景 (树/房子简化)
const innerGroup = new THREE.Group();
const treeGeo = new THREE.ConeGeometry(0.3, 0.8, 8);
const treeMat = new THREE.MeshStandardMaterial({ color: 0x228822 });
for(let i=0; i<5; i++) {
    const tree = new THREE.Mesh(treeGeo, treeMat);
    tree.position.set((Math.random()-0.5)*2, -1.5 + Math.random()*0.5, (Math.random()-0.5)*2);
    innerGroup.add(tree);
}
scene.add(innerGroup);

// 雪花系统
const snowCount = 800;
const snowGeo = new THREE.BufferGeometry();
const snowPos = new Float32Array(snowCount * 3);
for(let i=0; i<snowCount*3; i++) {
    snowPos[i] = (Math.random()-0.5) * 3.8;
    if(i%3===1) snowPos[i] = (Math.random()-0.5) * 3.8;
    if(i%3===2) snowPos[i] = (Math.random()-0.5) * 3.8;
}
snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
const snowMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.03, transparent: true });
const snow = new THREE.Points(snowGeo, snowMat);
scene.add(snow);

// 交互：拖拽旋转 & 缩放
let isDragging = false, prevX = 0, prevY = 0;
let rotX = 0, rotY = 0, targetRotX = 0, targetRotY = 0;
let zoom = 5, targetZoom = 5;

document.addEventListener('touchstart', e => { isDragging = true; prevX = e.touches[0].clientX; prevY = e.touches[0].clientY; });
document.addEventListener('touchend', () => isDragging = false);
document.addEventListener('touchmove', e => {
    if(!isDragging) return;
    const dx = e.touches[0].clientX - prevX;
    const dy = e.touches[0].clientY - prevY;
    if(e.touches.length > 1) {
        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        targetZoom = Math.max(3, Math.min(8, targetZoom + (dist > 200 ? -0.1 : 0.1)));
    } else {
        targetRotY += dx * 0.01;
        targetRotX += dy * 0.01;
    }
    prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
}, {passive: false});

// 鼠标兼容
document.addEventListener('mousedown', e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
document.addEventListener('mouseup', () => isDragging = false);
document.addEventListener('mousemove', e => {
    if(!isDragging) return;
    targetRotY += (e.clientX - prevX) * 0.01;
    targetRotX += (e.clientY - prevY) * 0.01;
    prevX = e.clientX; prevY = e.clientY;
});
document.addEventListener('wheel', e => { targetZoom = Math.max(3, Math.min(8, targetZoom + e.deltaY * 0.01)); });

// 按钮逻辑
let shaking = false;
document.getElementById('snowBtn').onclick = () => {
    // 触发一阵强下雪
    for(let i=0; i<snowCount; i++) {
        snowGeo.attributes.position.array[i*3+1] = 2; // 重置到顶部
    }
    snowGeo.attributes.position.needsUpdate = true;
};
document.getElementById('shakeBtn').onclick = () => { shaking = true; setTimeout(()=>shaking=false, 500); };

let audioCtx;
document.getElementById('musicBtn').onclick = function() {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    this.innerText = "🔊 播放中";
    // 简易风铃音效生成
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 1.5);
};

// 动画循环
function animate() {
    requestAnimationFrame(animate);
    
    // 平滑旋转与缩放
    rotX += (targetRotX - rotX) * 0.1;
    rotY += (targetRotY - rotY) * 0.1;
    zoom += (targetZoom - zoom) * 0.1;
    camera.position.x = Math.sin(rotY) * zoom;
    camera.position.z = Math.cos(rotY) * zoom;
    camera.position.y = rotX * 2;
    camera.lookAt(0, 0, 0);

    // 摇晃动画
    if(shaking) {
        crystalBall.rotation.z = (Math.random()-0.5)*0.2;
        innerGroup.rotation.z = (Math.random()-0.5)*0.2;
    } else {
        crystalBall.rotation.z *= 0.9;
        innerGroup.rotation.z *= 0.9;
    }

    // 雪花飘落
    const pos = snowGeo.attributes.position.array;
    for(let i=0; i<snowCount; i++) {
        pos[i*3+1] -= 0.02 + Math.random()*0.02; // y轴下落
        pos[i*3] += Math.sin(Date.now()*0.001 + i) * 0.005; // 左右飘
        if(pos[i*3+1] < -2) pos[i*3+1] = 2; // 循环
    }
    snowGeo.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
}
animate();

// 自适应
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
